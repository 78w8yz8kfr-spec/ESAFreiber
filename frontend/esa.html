<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#e30613">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <title>ESA Zeiterfassung</title>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111;background:#f5f5f7}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(180deg,#fff 0,#f5f5f7 100%)}
    main{max-width:520px;margin:0 auto;padding:24px 18px 48px}.card{background:#fff;border-radius:28px;padding:24px;box-shadow:0 18px 48px rgba(0,0,0,.10);margin-bottom:18px}
    .brand{display:flex;align-items:center;gap:16px}.logo{width:64px;height:64px;border-radius:18px;background:#111;color:#fff;display:grid;place-items:center;font-weight:800;font-size:24px}.eyebrow{letter-spacing:.16em;text-transform:uppercase;color:#6e6e73;font-weight:700;margin:0 0 4px}.brand h1{font-size:38px;margin:0}.muted{color:#6e6e73}.status{font-size:30px;font-weight:800;margin:8px 0}.time{font-variant-numeric:tabular-nums;font-size:52px;font-weight:800;margin:8px 0 18px}
    button,select,input{width:100%;font:inherit;border-radius:18px;border:1px solid #d2d2d7;padding:16px}button{border:0;background:#e30613;color:#fff;font-weight:800;font-size:20px;min-height:58px;touch-action:manipulation}button.secondary{background:#f2f2f7;color:#111;margin-top:12px}button:active{transform:scale(.99)}
    label{display:block;font-weight:700;margin:14px 0 8px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.entry{display:flex;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid #ececf0}.entry:last-child{border-bottom:0}.badge{display:inline-block;background:#fff0f0;color:#b60000;border-radius:999px;padding:6px 10px;font-weight:700}.hidden{display:none!important}
  </style>
</head>
<body>
<main>
  <section class="card">
    <div class="brand"><div class="logo">ESA</div><div><p class="eyebrow">Zeiterfassung</p><h1>ESA</h1></div></div>
    <p class="muted">Unabhängige Testversion ohne alten Schäfchen-Code und ohne Service Worker.</p>
  </section>

  <section class="card">
    <span class="badge" id="stateBadge">Nicht gestartet</span>
    <p class="status" id="stateTitle">Arbeitstag bereit</p>
    <div class="time" id="elapsed">00:00:00</div>
    <label for="site">Baustelle</label>
    <select id="site">
      <option>ESA Freiberg – Hauptbaustelle</option>
      <option>Baustelle Musterstraße</option>
      <option>Andere Baustelle</option>
    </select>
    <button id="startStop" type="button">Arbeitstag starten</button>
    <button id="pause" class="secondary" type="button" disabled>Pause beginnen</button>
  </section>

  <section class="card">
    <p class="eyebrow">Heute</p>
    <h2>Buchungen</h2>
    <div id="entries"><p class="muted">Noch keine Buchung.</p></div>
    <button id="reset" class="secondary" type="button">Testdaten zurücksetzen</button>
  </section>
</main>
<script>
(() => {
  'use strict';
  const key='esa.standalone.v1';
  const $=id=>document.getElementById(id);
  let state=JSON.parse(localStorage.getItem(key)||'{"running":false,"paused":false,"startedAt":null,"pauseStartedAt":null,"pauseMs":0,"entries":[]}');
  const save=()=>localStorage.setItem(key,JSON.stringify(state));
  const fmt=t=>new Date(t).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});
  function workedMs(){if(!state.startedAt)return 0;const end=state.running?Date.now():(state.endedAt||Date.now());let ms=end-state.startedAt-state.pauseMs;if(state.paused&&state.pauseStartedAt)ms-=Date.now()-state.pauseStartedAt;return Math.max(ms,0)}
  function duration(ms){const s=Math.floor(ms/1000);return [Math.floor(s/3600),Math.floor((s%3600)/60),s%60].map(v=>String(v).padStart(2,'0')).join(':')}
  function render(){
    $('elapsed').textContent=duration(workedMs());
    $('startStop').textContent=state.running?'Feierabend':'Arbeitstag starten';
    $('pause').disabled=!state.running;
    $('pause').textContent=state.paused?'Pause beenden':'Pause beginnen';
    $('stateBadge').textContent=state.running?(state.paused?'Pause':'Läuft'):'Nicht gestartet';
    $('stateTitle').textContent=state.running?(state.paused?'Pause aktiv':'Arbeitstag läuft'):'Arbeitstag bereit';
    $('entries').innerHTML=state.entries.length?state.entries.map(e=>`<div class="entry"><strong>${e.label}</strong><span>${fmt(e.at)}</span></div>`).join(''):'<p class="muted">Noch keine Buchung.</p>';
  }
  $('startStop').addEventListener('click',()=>{
    if(!state.running){state={...state,running:true,paused:false,startedAt:Date.now(),endedAt:null,pauseStartedAt:null,pauseMs:0,entries:[...state.entries,{label:'Arbeitsbeginn',at:Date.now()}]};}
    else{if(state.paused&&state.pauseStartedAt)state.pauseMs+=Date.now()-state.pauseStartedAt;state.running=false;state.paused=false;state.endedAt=Date.now();state.pauseStartedAt=null;state.entries.push({label:'Feierabend',at:Date.now()});}
    save();render();
  });
  $('pause').addEventListener('click',()=>{
    if(!state.running)return;
    if(!state.paused){state.paused=true;state.pauseStartedAt=Date.now();state.entries.push({label:'Pause begonnen',at:Date.now()});}
    else{state.pauseMs+=Date.now()-state.pauseStartedAt;state.paused=false;state.pauseStartedAt=null;state.entries.push({label:'Pause beendet',at:Date.now()});}
    save();render();
  });
  $('reset').addEventListener('click',()=>{localStorage.removeItem(key);location.reload();});
  setInterval(render,1000);render();
})();
</script>
</body>
</html>
