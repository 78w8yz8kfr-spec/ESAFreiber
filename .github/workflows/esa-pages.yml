name: ESA auf GitHub Pages veröffentlichen

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/esa-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: GitHub Pages konfigurieren
        uses: actions/configure-pages@v5

      - name: ESA-Dateien hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./frontend

      - name: ESA veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
